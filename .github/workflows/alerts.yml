# The alert tick. Vercel's Hobby cron runs at most once a day, so this schedule is what actually
# makes an outage turn into a message. The daily Vercel cron stays as a backstop for the case where
# this workflow is disabled or the repository is archived.
#
# Overlaps are harmless: /api/cron/alerts claims each distinct alert for an hour before repeating
# it, so a fault that persists is announced once rather than every twenty minutes.
name: alerts

on:
  schedule:
    - cron: "11,31,51 * * * *"
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    if: ${{ vars.ALERTS_ENABLED != 'false' }}
    steps:
      - name: Ask the deployment to check its upstream
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL or CRON_SECRET is not set; nothing to do."
            exit 0
          fi
          curl -fsS --max-time 30 "$APP_URL/api/cron/alerts" \
            -H "Authorization: Bearer $CRON_SECRET" | tee tick.json
          echo ""
